services:

  postgres_derebit:
    image: postgres:17-alpine
    container_name: psgr_derebit
    volumes:
      - postgres-data_derebit:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Europe/Minsk
    networks:
      - dbnet


  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - dbnet


  derebit_fastapi:
    build: .
    image: derebit_fastapi
    container_name: derebit_fastapi
    restart: always
    networks:
      - dbnet
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Minsk
    depends_on:
      - postgres_derebit


  celery-worker:
    build: .
    command: uv run celery -A app.tasks.celery_app worker --pool=prefork -c 4 --loglevel=info
    networks:
      - dbnet
    depends_on:
      - postgres_derebit
      - redis


  celery-beat:
    build: .
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - dbnet
    depends_on:
      - postgres_derebit
      - redis
    volumes:
      - ./app:/app/app


networks:
  dbnet:
    driver: bridge


volumes:
  postgres-data_derebit: